# Joint KiDS-Legacy Pm + A_mod with all 7 parameters free: cosmology from
# the direct Pm shape/amplitude, subgrid from the suppression. First
# cosmology+astrophysics joint constraint from power spectra alone.

trial_name: Pk_kids_amod_7p

targets:
  - kind: kids
    nz: nz3
    k_min: 0.03
    k_max: 7.0
    z_bins: [0.15, 0.45]   # z_fid=1.3 bin excluded (see Pk_kids_2cosmo.yaml)
  - kind: amod
    constraint: DES_Y3_Planck

param_mode: subgrid+cosmo
