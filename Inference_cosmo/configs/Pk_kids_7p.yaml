# KiDS-Legacy Pm with all 7 parameters free — the amod-free replacement for
# the retired Pk_kids_amod_7p (A_mod quarantined to amod_exploratory/,
# 2026-07-23). Cosmology and subgrid constrained by the direct matter P(k)
# alone; subgrid sensitivity enters through the baryonic suppression shape
# at k > 0.5 h/Mpc within the KiDS band.

trial_name: Pk_kids_7p

targets:
  - kind: kids
    nz: nz3
    k_min: 0.03
    k_max: 7.0
    z_bins: [0.15, 0.45]   # z_fid=1.3 bin excluded (see Pk_kids_2cosmo.yaml)

param_mode: subgrid+cosmo

mcmc:
  nwalkers: 32
  nburn: 800
  nrun: 3000
