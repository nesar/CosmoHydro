# Same as GSMF_CGD_Pk_5p_fid_cosmo but the GSMF & CGD likelihood terms include the
# GP emulator predictive variance (+ logdet), so their chi2/dof ~ 2 instead
# of ~7 and no single statistic dominates (see diagnose_emu_variance.py).
trial_name: GSMF_CGD_Pk_5p_fid_cosmo_emuvar
targets:
- kind: kids
  nz: nz3
  k_min: 0.03
  k_max: 7.0
  z_bins:
  - 0.15
  - 0.45
- kind: gsmf
  emu_variance: true
- kind: cgd
  emu_variance: true
param_mode: subgrid
flat_prior_indices:
- 4
