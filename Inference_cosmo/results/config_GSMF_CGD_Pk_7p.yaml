# Joint GSMF + CGD + KiDS power spectra (2 redshifts), all 7 params free.
# The "pk" (power-spectrum) analogue of Inference/ GSMF_CGD_7p: adds the KiDS
# multi-redshift matter P(k) forward model (via Inference_cosmo/) alongside the
# galaxy stellar mass function and cluster gas density profile.
#
# Priors: subgrid same as the GSMF+CGD runs (broad default Gaussian; eps_kin
# flat). Cosmology BROAD (default Gaussian N(midpoint, half-range), NOT the
# Planck-tight prior) — the power spectra now constrain cosmology directly.
trial_name: GSMF_CGD_Pk_7p

targets:
  - kind: kids            # KiDS-Legacy matter P(k) at 2 redshifts
    nz: nz3
    k_min: 0.03
    k_max: 7.0
    z_bins: [0.15, 0.45]  # z_fid=1.3 bin excluded (deprojection corner)
  - kind: gsmf            # galaxy stellar mass function (z=0)
  - kind: cgd             # cluster gas density profile (z=0)

param_mode: subgrid+cosmo

flat_prior_indices: [4]   # eps_kin flat; cosmology uses the broad default Gaussian
