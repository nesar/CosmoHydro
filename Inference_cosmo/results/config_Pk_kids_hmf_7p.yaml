# Joint KiDS-Legacy Pm + GAMA HMF, all 7 parameters free + GAMA mass-shift
# nuisance — the amod-free replacement for the retired Pk_kids_amod_hmf_7p
# (A_mod quarantined to amod_exploratory/, 2026-07-23). Power spectrum
# shape/amplitude + cluster/group abundance in one posterior.

trial_name: Pk_kids_hmf_7p

targets:
  - kind: kids
    nz: nz3
    k_min: 0.03
    k_max: 7.0
    z_bins: [0.15, 0.45]   # z_fid=1.3 bin excluded (see Pk_kids_2cosmo.yaml)
  - kind: gama_hmf
    logM_max: 14.9
    mass_shift: {initial: 0.0, min: -0.3, max: 0.3}

param_mode: subgrid+cosmo
