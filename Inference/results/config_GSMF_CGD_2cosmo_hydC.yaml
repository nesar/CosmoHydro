# Trial: GSMF + CGD, 2 cosmology params free, hydro FIXED at scan point C.
# Part of the fixed-hydro scan (diagnostics/select_fixed_hydro_points.py):
#   point C, Mahalanobis radius 2.06 sigma from the GSMF_CGD_7p_planck subgrid posterior
# Planck-width Gaussian cosmology prior, no hard truncation (design box only).
# Shared data/mcmc/obs_dirs/output_dir come from _defaults.yaml.
trial_name: GSMF_CGD_2cosmo_hydC

observables:
  - GSMF
  - CGD

param_mode: custom
free_params:
  - omega_m
  - sigma_8

# Fixed subgrid point C (scaled units), drawn from the GSMF_CGD_7p_planck posterior at
# Mahalanobis radius 2.06 sigma.
fixed_params:
  kappa_w: 3.1672
  e_w: 0.4915
  M_seed: 1.2084
  v_kin: 1.1759
  eps_kin: 0.2633

gaussian_priors:
  omega_m: {mu: 0.14176, sigma: 0.0011}
  sigma_8: {mu: 0.8102, sigma: 0.006}
