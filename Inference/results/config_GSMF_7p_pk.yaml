# Trial: GSMF only, all 7 params (5 subgrid + 2 cosmo). Same as GSMF_7p but the
# cosmology prior is tightened to a Planck-width Gaussian (sigma 0.0011 / 0.006),
# with NO hard truncation (only the design box bounds it) -> a complete (closed)
# cosmology posterior rather than one cut at a wall. Companion to GSMF_7p_trunc
# (which adds the hard +/-1sigma cut).
# Shared data/mcmc/obs_dirs/output_dir come from _defaults.yaml.
trial_name: GSMF_7p_pk

observables:
  - GSMF

param_mode: subgrid+cosmo

flat_prior_indices: [4]

# Planck-tight Gaussian cosmology prior (sigma 0.0011 / 0.006), overriding the
# moderate _defaults. NO hard truncation: only the design box bounds it, so the
# posterior is a complete (closed) distribution rather than cut at a wall.
gaussian_priors:
  omega_m: {mu: 0.14176, sigma: 0.0011}
  sigma_8: {mu: 0.8102, sigma: 0.006}
