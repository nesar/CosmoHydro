# Trial: GSMF ONLY, the 2 cosmology parameters (omega_m, sigma_8) free, with the
# 5 hydro params FIXED at the project fiducial hydro values. The GSMF-only control
# for the cosmo marg-vs-fixed check; pairs apples-to-apples with the GSMF-only 7p
# run (GSMF_7p.yaml).
#
# Purpose: isolate the effect of *fixing hydro* on the cosmology constraint,
# without the cluster-gas (CGD+fGas) observables that drive omega_m to the design
# edge in the 3-observable runs. Cosmology prior is the shared project default
# (moderate fiducial-centered Gaussian; configs/_defaults.yaml).
# Shared data/mcmc/obs_dirs/output_dir come from _defaults.yaml.
trial_name: GSMF_2cosmo

observables:
  - GSMF

param_mode: custom
free_params:
  - omega_m
  - sigma_8

# Hydro fixed at the project FIDUCIAL hydro values (not design midpoints):
#   kappa_w=3, e_w=0.5, M_seed/1e6=0.8, v_kin/1e4=0.51, eps_kin/1e1=0.13.
fixed_params:
  kappa_w: 3.0
  e_w: 0.5
  M_seed: 0.8
  v_kin: 0.51
  eps_kin: 0.13

flat_prior_indices: []
