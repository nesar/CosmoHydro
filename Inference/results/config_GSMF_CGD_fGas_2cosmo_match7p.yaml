# Trial: GSMF + CGD + fGas, 2 cosmology parameters ONLY, hydro params FIXED at
# design midpoints. Cosmology priors deliberately match the broad defaults used
# by GSMF_CGD_fGas_7p.yaml (midpoint Gaussian with sigma = half-range), so the
# only difference between this run and the 7p run's (omega_m, sigma_8) marginal
# is the treatment of hydro parameters (fixed vs. marginalized).
# Shared data/mcmc/obs_dirs/output_dir come from _defaults.yaml.
trial_name: GSMF_CGD_fGas_2cosmo_match7p

observables:
  - GSMF
  - CGD
  - fGas

param_mode: custom
free_params:
  - omega_m
  - sigma_8

# Hydro fixed at design midpoints (matches the existing 2cosmo convention).
fixed_params:
  kappa_w: 3.0
  e_w: 0.6
  M_seed: 1.3
  v_kin: 0.65
  eps_kin: 0.61

# NO explicit gaussian_priors -> ln_prior falls back to broad default
# (mu = midpoint, sigma = half-range) for both cosmology params. This is the
# SAME prior the 7p run sees on omega_m / sigma_8.
flat_prior_indices: []
