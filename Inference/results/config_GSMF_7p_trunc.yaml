# Trial: GSMF only, all 7 params, with the cosmology prior HARD-TRUNCATED to
# the fiducial ±1sigma window (the moderate-prior "limits"). Same as GSMF_7p but
# with param_ranges narrowing omega_m/sigma_8 so ln_prior -> -inf outside the
# window and walkers stay inside it. Tests whether a hard wall near fiducial
# stops cosmology railing to the design-box edge.
# Shared data/mcmc/obs_dirs/output_dir come from _defaults.yaml.
trial_name: GSMF_7p_trunc

observables:
  - GSMF

param_mode: subgrid+cosmo

flat_prior_indices: [4]

# Planck-tight cosmology prior (sigma 0.0011 / 0.006), hard-truncated at
# fiducial ±1sigma. Overrides the moderate gaussian_priors from _defaults.
gaussian_priors:
  omega_m: {mu: 0.14176, sigma: 0.0011}
  sigma_8: {mu: 0.8102, sigma: 0.006}
param_ranges:
  omega_m: [0.14066, 0.14286]
  sigma_8: [0.8042, 0.8162]
