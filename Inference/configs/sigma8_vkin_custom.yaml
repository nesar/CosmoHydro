# Trial: Custom parameter space — only sigma8 + kinetic feedback params.
# Shared data/mcmc/obs_dirs/output_dir come from _defaults.yaml.
trial_name: sigma8_vkin_custom

observables:
  - GSMF
  - CGD

param_mode: custom
# Specify exactly which parameters to vary (by short key).
# Available keys: kappa_w, e_w, M_seed, v_kin, eps_kin, omega_m, sigma_8
free_params:
  - v_kin
  - eps_kin
  - sigma_8

# Fix all other parameters at these values (scaled units).
# omega_m here is omega_m = Omega_m * h^2, fixed to the project fiducial:
#   Omega_cdm=0.26067, Omega_b*h^2=0.02242, H0=67.66 -> omega_m = 0.14176.
fixed_params:
  kappa_w: 3.0
  e_w: 0.5
  M_seed: 0.8       # 8e5 / 1e6
  omega_m: 0.14176
