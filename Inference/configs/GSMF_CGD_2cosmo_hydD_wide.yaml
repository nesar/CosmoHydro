# Trial: GSMF + CGD, 2 cosmology params free, hydro FIXED at scan point D.
# Part of the fixed-hydro scan (diagnostics/select_fixed_hydro_points.py):
#   point D, Mahalanobis radius 2.07 sigma from the GSMF_CGD_7p_pk subgrid posterior
# WIDE variant: flat cosmology prior over the full design box.
# Shared data/mcmc/obs_dirs/output_dir come from _defaults.yaml.
trial_name: GSMF_CGD_2cosmo_hydD_wide

observables:
  - GSMF
  - CGD

param_mode: custom
free_params:
  - omega_m
  - sigma_8

# Fixed subgrid point D (scaled units), drawn from the GSMF_CGD_7p_pk posterior at
# Mahalanobis radius 2.07 sigma.
fixed_params:
  kappa_w: 3.3468
  e_w: 0.4548
  M_seed: 1.1728
  v_kin: 1.1970
  eps_kin: 0.2177

# WIDE-PRIOR variant: FLAT prior over the FULL experimental design box
# (omega_m in [0.12, 0.155], sigma_8 in [0.70, 0.90]).
# flat_prior_indices bypasses the moderate gaussian_priors inherited
# from _defaults.yaml (ln_prior checks flat indices first), so the only
# constraint on cosmology is the design-box boundary.
flat_prior_indices: [0, 1]
