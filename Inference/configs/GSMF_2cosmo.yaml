# Trial: GSMF ONLY, the 2 cosmology parameters (omega_m, sigma_8) free, with the
# 5 hydro params FIXED at design midpoints. The GSMF-only control for the cosmo
# marg-vs-fixed check: same setup as GSMF_CGD_fGas_2cosmo.yaml but with CGD+fGas
# removed, so it pairs apples-to-apples with the GSMF-only 7p run (GSMF_7p.yaml).
#
# Purpose: isolate the effect of *fixing hydro* on the cosmology constraint,
# without the cluster-gas (CGD+fGas) observables that drive omega_m to the design
# edge in the 3-observable runs. Cosmology prior is the shared project default
# (moderate fiducial-centered Gaussian; configs/_defaults.yaml).
# Shared data/mcmc/obs_dirs/output_dir come from _defaults.yaml.
trial_name: GSMF_2cosmo

observables:
  - GSMF

param_mode: custom
free_params:
  - omega_m
  - sigma_8

# Hydro fixed at design midpoints (same convention as GSMF_CGD_fGas_2cosmo).
fixed_params:
  kappa_w: 3.0
  e_w: 0.6
  M_seed: 1.3
  v_kin: 0.65
  eps_kin: 0.61

flat_prior_indices: []
