# Trial: GSMF + CGD, 2 cosmology params free, hydro fixed at FIDUCIAL. Planck-width
# Gaussian cosmology prior (sigma 0.0011 / 0.006), NO hard truncation (design box
# only) -> a complete cosmology posterior. Companion to GSMF_CGD_2cosmo_trunc.
# Shared data/mcmc/obs_dirs/output_dir come from _defaults.yaml.
trial_name: GSMF_CGD_2cosmo_planck

observables:
  - GSMF
  - CGD

param_mode: custom
free_params:
  - omega_m
  - sigma_8

# Hydro fixed at the project FIDUCIAL hydro values.
fixed_params:
  kappa_w: 3.0
  e_w: 0.5
  M_seed: 0.8
  v_kin: 0.51
  eps_kin: 0.13

# Planck-tight Gaussian cosmology prior (sigma 0.0011 / 0.006), overriding the
# moderate _defaults. NO hard truncation: only the design box bounds it, so the
# posterior is a complete (closed) distribution rather than cut at a wall.
gaussian_priors:
  omega_m: {mu: 0.14176, sigma: 0.0011}
  sigma_8: {mu: 0.8102, sigma: 0.006}
