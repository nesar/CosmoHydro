# Shared defaults for every MCMC trial config in this directory.
# run_mcmc.py loads this file first, then deep-merges the trial config on top.
# Trial configs only need to specify trial-specific fields and any overrides.
#
# Editing num_sims, DirIn, or model_dir here updates every trial in one place.

data:
  DirIn: ../data/scidac-400MPC_RUNS_5SG_2COSMO_PARAM-extracts_20260323/
  design_file: ../data/FinalDesign.txt
  num_sims: 109
  start_sim_idx: 1
  # Matches training notebooks 01/02/03 (`exp_variance = 0.999`). Only Pk
  # was trained with 0.95 (02_train_emulators_multiz.ipynb:2666). At load
  # time load_model_autosync reads the actual n_pc from each pickle, so
  # this YAML value is only the fallback when the pickle has no betaU info.
  exp_variance: 0.999
  z_index: 0
  model_dir: ../models/

obs_dirs:
  gsmf: /home/nramachandra/Projects/Hydro_runs/HAvoCC/havocc/analysis/modules/galaxy_modules/GalStellarMassFunction/data/
  cgd:  /home/nramachandra/Projects/Hydro_runs/HAvoCC/havocc/analysis/modules/halo_profile_modules/ClusterGasDensityProfile/data/
  cged: /home/nramachandra/Projects/Hydro_runs/HAvoCC/havocc/analysis/modules/halo_profile_modules/ClusterGasElectronDensityProfile/data/

mcmc:
  nwalkers: 400
  nburn: 100
  nrun: 4000
  parallel: true

fixed_params: {}
bias_params: []
flat_prior_indices: []

output_dir: results/