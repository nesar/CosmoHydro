# Trial: GSMF + CGD + fGas, 2 cosmology parameters ONLY, hydro params FIXED at
# design midpoints. Same setup as GSMF_CGD_fGas_2cosmo_match7p.yaml EXCEPT the
# cosmology prior: instead of the broad default (midpoint Gaussian, sigma =
# half-range), this run uses a moderately stronger truncated-Gaussian prior
# centered on the project fiducial cosmology.
#
# Motivation: with hydro fixed at midpoints the GSMF+CGD+fGas likelihood drags
# (omega_m, sigma_8) to the upper edge of the design box, so the _match7p
# posterior rails against the prior boundary rather than measuring cosmology.
# A fiducial-centered, ~3.5x tighter prior pulls the posterior off the wall
# while still leaving the data room to move it.
#
# Fiducial cosmology (Omega_cdm=0.26067, Omega_b*h^2=0.02242, H0=67.66,
# sigma_8=0.8102) -> omega_m = Omega_m*h^2 = 0.14176, sigma_8 = 0.8102.
# Strength sits between the broad default (sigma_om=0.0175, sigma_s8=0.10) and
# the Planck-tight GSMF_CGD_fGas_7p_fidprior (sigma_om=0.001, sigma_s8=0.006).
# Shared data/mcmc/obs_dirs/output_dir come from _defaults.yaml.
trial_name: GSMF_CGD_fGas_2cosmo_fidprior

observables:
  - GSMF
  - CGD
  - fGas

param_mode: custom
free_params:
  - omega_m
  - sigma_8

# Hydro fixed at design midpoints (matches the existing 2cosmo convention).
fixed_params:
  kappa_w: 3.0
  e_w: 0.6
  M_seed: 1.3
  v_kin: 0.65
  eps_kin: 0.61

# Moderately stronger truncated-Gaussian prior on cosmology, centered on fiducial.
gaussian_priors:
  omega_m: {mu: 0.14176, sigma: 0.005}
  sigma_8: {mu: 0.8102, sigma: 0.03}

flat_prior_indices: []
