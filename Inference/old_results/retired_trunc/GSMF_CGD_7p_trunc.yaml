# Trial: GSMF + CGD, all 7 params, cosmology prior HARD-TRUNCATED to fiducial
# ±1sigma. Same as GSMF_CGD_7p but with param_ranges (see GSMF_7p_trunc).
# Shared data/mcmc/obs_dirs/output_dir come from _defaults.yaml.
trial_name: GSMF_CGD_7p_trunc

observables:
  - GSMF
  - CGD

param_mode: subgrid+cosmo

flat_prior_indices: [4]

# Planck-tight cosmology prior (sigma 0.0011 / 0.006), hard-truncated at
# fiducial ±1sigma. Overrides the moderate gaussian_priors from _defaults.
gaussian_priors:
  omega_m: {mu: 0.14176, sigma: 0.0011}
  sigma_8: {mu: 0.8102, sigma: 0.006}
param_ranges:
  omega_m: [0.14066, 0.14286]
  sigma_8: [0.8042, 0.8162]
