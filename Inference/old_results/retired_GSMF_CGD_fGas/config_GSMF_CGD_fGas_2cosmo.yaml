# Trial: GSMF + CGD + fGas, ONLY the 2 cosmology parameters (omega_m, sigma_8).
# Subgrid parameters fixed at design midpoints. This is THE canonical 2-cosmology
# run (the former _match7p / _fidprior variants were retired into this one).
# The cosmology prior is the shared project default from _defaults.yaml
# (moderate truncated Gaussian centered on the fiducial, sigma = 0.005 / 0.03) —
# no per-trial prior block needed.
# Shared data/mcmc/obs_dirs/output_dir come from _defaults.yaml.
trial_name: GSMF_CGD_fGas_2cosmo

observables:
  - GSMF
  - CGD
  - fGas

param_mode: custom
free_params:
  - omega_m
  - sigma_8

# Other params fixed at design midpoints (matches sigma8_vkin_custom convention).
fixed_params:
  kappa_w: 3.0
  e_w: 0.6
  M_seed: 1.3
  v_kin: 0.65
  eps_kin: 0.61
